name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant. Tag builds are exempt,
# because those produce releases and must not be cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Loom keeps the decompiled/remapped Minecraft outside the normal Gradle caches, and
      # rebuilding it costs several minutes and a few hundred megabytes of download. Key the cache
      # on gradle.properties, which is where every version we depend on is declared.
      - name: Cache Loom's Minecraft artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            loom-${{ runner.os }}-

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Artifacts'
            echo
            echo '| jar | size |'
            echo '|---|---|'
            for jar in fabric/build/libs/*.jar paper/build/libs/*.jar; do
              case "$jar" in
                *-sources.jar) continue ;;
                *'*'*) continue ;;
              esac
              printf '| `%s` | %s |\n' "$(basename "$jar")" "$(du -h "$jar" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/reports/tests/**'
          retention-days: 7

      - name: Upload the client mod
        uses: actions/upload-artifact@v7
        with:
          name: xetiusmap-client
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload the server plugin
        uses: actions/upload-artifact@v7
        with:
          name: xetiusmap-server
          path: |
            paper/build/libs/*.jar
            !paper/build/libs/*-sources.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Collect the built jars
        uses: actions/download-artifact@v8
        with:
          pattern: xetiusmap-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.jar
          generate_release_notes: true
          body: |
            Built from `${{ github.sha }}` for Minecraft 26.2.

            - `xetiusmap-client-*.jar` goes in the client's `mods/` folder, alongside Fabric API.
            - `xetiusmap-server-*.jar` goes in the server's `plugins/` folder.

            The mod works without the plugin — you just get a local map instead of a shared one.
